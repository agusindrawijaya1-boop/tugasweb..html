<section class="gallery container">

    <h2>Galeri Foto</h2>

    <!-- FILTER -->
    <div class="filter-buttons">
        <button data-filter="all" class="active">Semua</button>
        <button data-filter="produk">Produk</button>
        <button data-filter="kegiatan">Kegiatan</button>
        <button data-filter="lain">Lainnya</button>
    </div>

    <!-- GRID -->
    <div class="grid">

        <div class="item produk">
            <img src="https://picsum.photos/400?1">
        </div>

        <div class="item kegiatan">
            <img src="https://picsum.photos/400?2">
        </div>

        <div class="item lain">
            <img src="https://picsum.photos/400?3">
        </div>

        <div class="item produk">
            <img src="https://picsum.photos/400?4">
        </div>

        <div class="item kegiatan">
            <img src="https://picsum.photos/400?5">
        </div>

        <div class="item lain">
            <img src="https://picsum.photos/400?6">
        </div>

    </div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <img id="lightbox-img">
</div>
